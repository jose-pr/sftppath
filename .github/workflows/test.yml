name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      pathlib_next_ref:
        description: "Git ref of jose-pr/pathlib-next to install instead of the release (branch, tag, or SHA); empty uses the repository variable PATHLIB_NEXT_REF"
        required: false
        default: ""
      uripath_ref:
        description: "Git ref of jose-pr/uripath to install instead of the release (branch, tag, or SHA); empty uses the repository variable URIPATH_REF"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark suite (manual runs only)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pathlib-next and the uripath every job that needs them installs first:
  # a git ref of jose-pr/pathlib-next (jose-pr/uripath) from the dispatch input,
  # else from the repository variable PATHLIB_NEXT_REF (URIPATH_REF); a ci-* tag
  # has no input. With both empty, pip takes the release range that
  # pyproject.toml declares from PyPI. A ref must hold a version inside that
  # range.
  CORE_REF: ${{ inputs.pathlib_next_ref || vars.PATHLIB_NEXT_REF }}
  URIPATH_REF: ${{ inputs.uripath_ref || vars.URIPATH_REF }}

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        # They go in first, so the step below finds their ranges satisfied.
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "uripath @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install the package with both SSH libraries, uripath and its test tools
        # A missing library skips its tests (pytest.importorskip) instead of
        # running them.
        run: python -m pip install -e ".[dev,all]"
      - name: Run tests
        # -rs lists every skip with its reason, so a missing extra shows up.
        run: python -m pytest -q -rs

  # The path without the URI scheme: both SSH libraries and no uripath. The
  # tests of the sftp: scheme skip, `import sftppath.uri` names the extra, and
  # nothing else changes.
  without-uripath:
    name: Without uripath (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install the package with both SSH libraries and no uripath
        run: python -m pip install -e ".[dev,paramiko,asyncssh]"
      - name: Importing the URI module names the extra
        shell: python
        run: |
          import importlib.util

          assert importlib.util.find_spec("uripath") is None, "uripath is installed"
          try:
              import sftppath.uri
          except ImportError as error:
              assert 'pip install "sftppath[uri]"' in str(error), error
              print("ok:", error)
          else:
              raise SystemExit("import sftppath.uri succeeded without uripath")
      - name: Run tests
        run: python -m pytest -q -rs

  # The package as a user gets it from `pip install sftppath`: no SSH library,
  # no uripath, none of `dev` but pytest. The import loads nothing optional, a
  # path can be built and its first request names both extras, and the tests
  # that need nothing else run (the rest skip, and -rs says which).
  bare:
    name: Bare install (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install the package with pytest and nothing else
        run: python -m pip install -e . pytest
      - name: Import it; no optional library is loaded; a request names both extras
        shell: python
        run: |
          import sys

          import sftppath

          loaded = {"paramiko", "asyncssh", "uripath"} & set(sys.modules)
          assert not loaded, "importing sftppath loaded %s" % sorted(loaded)
          path = sftppath.SFTPPath("/x", host="h")
          try:
              path.stat()
          except ImportError as error:
              assert "sftppath[paramiko]" in str(error) and "sftppath[asyncssh]" in str(error), error
              print("ok:", sftppath.__version__)
          else:
              raise SystemExit("a request was made with no SSH library")
      - name: Run the tests that need nothing else
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only
  # ever gets the newest releases, so a floor that no longer works would
  # otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install pathlib-next and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        # Without a ref the release is installed at its floor, below.
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "uripath @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev,all]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The two typing checks of tests/test_public_surface.py (mypy and pyright on
  # a consumer script) skip unless a checker is importable, and no other job
  # installs one: they run here. The step fails if either was skipped.
  typing:
    name: Typing checks (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install the package, pytest and the two checkers
        # basedpyright, not the PyPI `pyright`: that one downloads node at
        # run time. The test accepts either. Both SSH libraries, because the
        # consumer script names the backends.
        run: python -m pip install -e ".[paramiko,asyncssh]" pytest mypy basedpyright
      - name: Run the typing checks
        run: |
          python -m pytest -q -rs tests/test_public_surface.py -k "mypy_accepts or pyright_accepts" | tee typing.log
          grep -q "2 passed" typing.log

  benchmark:
    name: Benchmarks (py3.14, ${{ matrix.os }})
    # Opt-in: benchmarks are noisy and slow, so they never run on ci-* tags
    # or by default; dispatch the workflow with benchmark=true.
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pathlib-next and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "uripath @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Run benchmark suite
        shell: pwsh
        run: |
          python benchmarks/bench.py --save --name "ci-${{ matrix.os }}-py3.14" | Tee-Object -FilePath benchmark.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.txt
            benchmarks/results/*.json
