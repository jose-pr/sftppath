name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
#
# Test gate (with and without uripath) and dependency-floor gate, build
# (checking that the tag names the version built), an installed-wheel smoke
# test with and without the extras, a strict docs build gate, the GitHub
# Release, then -- for final (non pre-release) tags only -- the PyPI upload and
# a dispatch of docs.yml at this tag. The docs site is only GATED here
# (docs-gate never deploys); docs.yml owns every Pages deploy.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # A git ref of jose-pr/pathapi and one of jose-pr/uripath to install first
  # (the repository variables PATHAPI_REF and URIPATH_REF), for a
  # pre-release made while the versions that pyproject.toml asks for are not on
  # PyPI yet. Empty installs them from PyPI. A final tag refuses a ref: what is
  # released is what users install.
  CORE_REF: ${{ vars.PATHAPI_REF }}
  URIPATH_REF: ${{ vars.URIPATH_REF }}

jobs:
  released-dependencies:
    name: Source of pathapi and uripath
    runs-on: ubuntu-latest
    steps:
      - name: Say where they come from
        run: |
          echo "pathapi from ${CORE_REF:-PyPI}"
          echo "uripath from ${URIPATH_REF:-PyPI}"
      - name: Refuse a git ref on a final tag
        if: ${{ (env.CORE_REF != '' || env.URIPATH_REF != '') && !contains(github.ref_name, '-') }}
        run: |
          echo "PATHAPI_REF or URIPATH_REF is set: a final release is tested against the releases on PyPI. Release them first and delete the repository variables." >&2
          exit 1

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathapi and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "pathapi-uri @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install the package with both SSH libraries, uripath and its test tools
        run: python -m pip install -e ".[dev,all]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The same job test.yml runs: the path must hold without uripath.
  without-uripath:
    name: Without uripath (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathapi from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"
      - name: Install the package with both SSH libraries and no uripath
        run: python -m pip install -e ".[dev,paramiko,asyncssh]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The same job test.yml runs: a release must hold at the lowest version of every
  # dependency the manifest claims to support.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install pathapi and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        # Without a ref the release is installed at its floor, below.
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "pathapi-uri @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev,all]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The two typing checks of tests/test_public_surface.py (mypy and pyright on
  # a consumer script) skip unless a checker is importable, and no other job
  # installs one: they run here. The step fails if either was skipped.
  typing:
    name: Typing checks (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathapi from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"
      - name: Install the package, pytest and the two checkers
        # basedpyright, not the PyPI `pyright`: that one downloads node at
        # run time. The test accepts either.
        run: python -m pip install -e ".[paramiko,asyncssh]" pytest mypy basedpyright
      - name: Run the typing checks
        run: |
          python -m pytest -q -rs tests/test_public_surface.py -k "mypy_accepts or pyright_accepts" | tee typing.log
          grep -q "2 passed" typing.log

  build:
    name: Build distribution
    needs: [released-dependencies, test, without-uripath, floors, typing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it into two
  # clean environments, one as `pip install sftppath` and one with every extra,
  # and check that each imports, carries the files it must ship and behaves as
  # that install should.
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh venv, and into one with every extra
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv "$RUNNER_TEMP/bare"
          python -m venv "$RUNNER_TEMP/full"
          for venv in bare full; do
            if [ -n "$CORE_REF" ]; then
              "$RUNNER_TEMP/$venv/bin/pip" install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"
            fi
          done
          if [ -n "$URIPATH_REF" ]; then
            "$RUNNER_TEMP/full/bin/pip" install "pathapi-uri @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"
          fi
          "$RUNNER_TEMP/bare/bin/pip" install "$wheel"
          "$RUNNER_TEMP/full/bin/pip" install "$wheel[all]"
      - name: Import it, and find the files it must ship
        working-directory: ${{ runner.temp }}
        run: |
          cat > check.py <<'PY'
          from importlib.metadata import entry_points
          from importlib.resources import files
          import sys

          import sftppath

          root = files("sftppath")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          found = entry_points()
          if hasattr(found, "select"):
              schemes = list(found.select(group="uripath.schemes"))
          else:
              schemes = list(found.get("uripath.schemes", []))
          names = {ep.name for ep in schemes if ep.value.startswith("sftppath.")}
          assert names == {"sftp"}, "expected the sftp entry point, found %s" % sorted(names)
          loaded = {"paramiko", "asyncssh", "uripath"} & set(sys.modules)
          assert not loaded, "importing sftppath loaded %s" % sorted(loaded)
          print("ok:", sftppath.__name__, sftppath.__version__)
          PY
          for venv in bare full; do
            "$RUNNER_TEMP/$venv/bin/python" check.py
          done
      - name: Without the extra the URI module names it
        working-directory: ${{ runner.temp }}
        run: |
          cat > check_uri.py <<'PY'
          try:
              import sftppath.uri
          except ImportError as error:
              assert 'sftppath[uri]' in str(error), error
          else:
              raise SystemExit("imported without uripath")
          PY
          "$RUNNER_TEMP/bare/bin/python" check_uri.py
      - name: With the extras the scheme is found and a path is built
        working-directory: ${{ runner.temp }}
        run: |
          cat > check_scheme.py <<'PY'
          from uripath import URIPath
          from sftppath import SFTPPath

          assert type(URIPath("sftp://u@h/srv/x")).__name__ == "SFTPURIPath"
          assert SFTPPath("/srv/x", host="h", user="u").as_uri() == "sftp://u@h/srv/x"
          PY
          "$RUNNER_TEMP/full/bin/python" check_scheme.py

  # Docs are DEPLOYED by docs.yml. This job only GATES the release on a strict
  # docs BUILD: a release must never ship if the docs site is broken, but the
  # release path never deploys Pages itself -- the docs-deploy job at the end
  # dispatches docs.yml for this tag, off the publish chain.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pathapi and uripath from their git refs, if set
        if: ${{ env.CORE_REF != '' || env.URIPATH_REF != '' }}
        shell: bash
        run: |
          if [ -n "$CORE_REF" ]; then python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"; fi
          if [ -n "$URIPATH_REF" ]; then python -m pip install "pathapi-uri @ git+https://github.com/jose-pr/uripath@${URIPATH_REF}"; fi
      - name: Install package with docs tooling
        run: python -m pip install -e ".[all,docs]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Pin the release object to the tagged commit; left unset it defaults
          # to the default branch.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # After the GitHub release, and only for a final tag: a PyPI upload is
  # irreversible (a version can never be reused), a GitHub release is not.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sftppath/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip them
          # and publish only what's missing. The build job's tag/version check
          # keeps it from masking a wrong tag.
          skip-existing: true

  # Events made with the workflow's own GITHUB_TOKEN, such as the release above,
  # start no workflows, so docs.yml cannot listen for the release itself. A
  # workflow_dispatch is the exception: it deploys the docs at this tag. A
  # pre-release leaves the published docs alone. Off the publish chain, so a
  # docs problem never blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
